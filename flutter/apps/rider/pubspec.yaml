name: rider
description: "iyodriver — rides and car rentals in Cameroon (rider app)."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  iyo_core:
    path: ../../packages/iyo_core
  iyo_ui:
    path: ../../packages/iyo_ui

  intl: any
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/

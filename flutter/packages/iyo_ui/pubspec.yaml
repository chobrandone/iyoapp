name: iyo_ui
description: iyodriver design system — theme tokens, Poppins, shared widgets, map widgets and the dev component gallery.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  iyo_core:
    path: ../iyo_core
  lucide_icons_flutter: ^3.1.25
  maplibre_gl: 0.22.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins-ExtraBold.ttf
          weight: 800
